<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>尋找物資 — 閒置物資共享平台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 導覽列 -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">♻️ 物資共享平台</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="index.html">首頁</a></li>
          <li class="nav-item"><a class="nav-link" href="browse.html">尋找物資</a></li>
          <li class="nav-item"><a class="nav-link" href="my-listings.html">我的刊登</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">關於平台</a></li>
          <li class="nav-item ms-lg-2">
            <a class="nav-link btn-navbar-cta" href="donate.html">我要提供物資</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 頁面標題 -->
  <div style="background-color:#e8f5e9; border-bottom:1px solid #c8e6c9;">
    <div class="container py-3">
      <h1 class="h4 mb-0 fw-bold" style="color:#1b5e20;">🛍️ 尋找物資</h1>
    </div>
  </div>

  <div class="page-content">
    <div class="container">

      <!-- 搜尋區塊 -->
      <div class="search-bar-section">
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <label for="search-input" class="form-label fw-semibold">關鍵字搜尋</label>
            <input type="text" id="search-input" class="form-control" placeholder="搜尋物品名稱或描述..." />
          </div>
          <div class="col-md-4">
            <label for="category-select" class="form-label fw-semibold">分類篩選</label>
            <select id="category-select" class="form-select">
              <option value="">全部分類</option>
              <option value="家電">家電</option>
              <option value="家具">家具</option>
              <option value="書籍">書籍</option>
              <option value="衣物">衣物</option>
              <option value="嬰幼兒用品">嬰幼兒用品</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary w-100" id="reset-btn">重設</button>
          </div>
        </div>
      </div>

      <!-- 結果數量 -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="result-count" class="text-muted" style="font-size:0.9rem;"></span>
      </div>

      <!-- 物品卡片 -->
      <div class="row g-3" id="items-container">
        <div class="col-12 text-center py-4 text-muted">載入中...</div>
      </div>

    </div>
  </div>

  <!-- 頁尾 -->
  <footer>
    <div class="container">
      <div class="row">
        <div class="col-md-4 mb-3">
          <div class="footer-brand">♻️ 物資共享平台</div>
          <p class="mt-2" style="font-size:0.88rem;">讓閒置物資找到需要的人，<br>共同打造零廢棄的生活圈。</p>
        </div>
        <div class="col-md-4 mb-3">
          <h6 class="text-white fw-bold mb-2">快速連結</h6>
          <ul class="list-unstyled mb-0" style="font-size:0.9rem;">
            <li><a href="index.html">首頁</a></li>
            <li><a href="browse.html">尋找物資</a></li>
            <li><a href="donate.html">我要提供物資</a></li>
            <li><a href="about.html">關於平台</a></li>
          </ul>
        </div>
        <div class="col-md-4 mb-3">
          <h6 class="text-white fw-bold mb-2">聯絡我們</h6>
          <p style="font-size:0.88rem;">如有問題，歡迎來信：<br>
            <a href="mailto:contact@shareplatform.tw">contact@shareplatform.tw</a>
          </p>
        </div>
      </div>
      <div class="footer-copy text-center border-top pt-3 mt-2">
        © 2025 閒置物資共享平台 MVP-group14 · All rights reserved.
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
